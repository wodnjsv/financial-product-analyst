[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-product-agent"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.23,<5",
  "pytest>=8,<9",
]
storage = [
  "SQLAlchemy[asyncio]>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.3,<1",
  "pytest-asyncio>=0.24,<1",
]
ingestion = [
  "openpyxl>=3.1,<4",
  "boto3>=1.35,<2",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "postgres: requires an explicitly configured PostgreSQL test database",
  "ncp_integration: requires an explicitly configured non-production NCP Cloud DB",
  "performance: requires RUN_DB_SCALE_TESTS=1 and synthetic scale data",
  "organizer_data: requires the ignored local organizer workbooks",
  "object_storage: requires an explicitly configured private Object Storage target",
  "official_data: requires explicitly configured live official sources",
]

[tool.setuptools.packages.find]
where = ["src"]
